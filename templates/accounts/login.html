{% extends 'base.html' %}
{% block title %}Đăng nhập | MixFood Manager{% endblock %}
{% block content %}
<section class="legacy-login">
    <div class="legacy-dialog-title">Đăng nhập hệ thống - MIX FOOD</div>
    <div class="legacy-dialog-body">
        <div class="legacy-login-mark">DRS<br><small>Manager 3.1.7</small></div>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}<p class="form-error">Sai tên đăng nhập hoặc mật khẩu.</p>{% endif %}
            <label for="id_username">Tên đăng nhập</label>{{ form.username }}
            <label for="id_password">Mật khẩu</label>{{ form.password }}
            <div class="legacy-login-actions"><button class="primary-button" type="submit">Đăng nhập</button><button class="secondary-button" type="reset">Hủy</button></div>
        </form>
    </div>
</section>
{% endblock %}
