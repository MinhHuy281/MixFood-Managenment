<!-- # File này chịu trách nhiệm hiển thị hộp thoại Nhật ký hoạt động hệ thống (Activity Log Modal) trên màn hình POS để tra cứu lịch sử thao tác theo thời gian thực. -->
<div class="menu-modal-backdrop" id="pos-activity-admin-modal" hidden>
    <div class="activity-admin-modal-container">
        <!-- # Modal Header -->
        <div class="menu-modal-header activity-modal-header">
            <div class="modal-title-wrap u-audi-33e85a31">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <h3 class="u-audi-1f22ecc1">Nhật ký hoạt động - {{ request.user.get_username|default:"Admin" }}</h3>
            </div>
            <button type="button" class="dialog-close" id="pos-activity-modal-close" aria-label="Đóng">&times;</button>
        </div>

        <!-- # Filter Toolbar (Từ ngày, Đến ngày, Loại hoạt động, Nhân viên, Nhật ký gọi món) -->
        <div class="activity-modal-toolbar">
            <div class="activity-date-range">
                <label for="pos-activity-date-from">Từ</label>
                <div class="date-input-wrap">
                    <input type="date" id="pos-activity-date-from" class="pos-activity-date-input filter-date-input" value="{{ current_time|date:'Y-m-d' }}">
                </div>
                <label for="pos-activity-date-to">Đến</label>
                <div class="date-input-wrap">
                    <input type="date" id="pos-activity-date-to" class="pos-activity-date-input filter-date-input" value="{{ current_time|date:'Y-m-d' }}">
                </div>
            </div>

            <div class="activity-filters">
                <select id="pos-activity-action-select" class="activity-select">
                    <option value="">&lt;Loại hoạt động&gt;</option>
                    <option value="reserve_table">Đặt bàn</option>
                    <option value="transfer_table">Chuyển</option>
                    <option value="stock_receipt">Nhập</option>
                    <option value="merge_table">Ghép</option>
                    <option value="split_table">Tách</option>
                    <option value="edit_invoice">Sửa hóa đơn</option>
                    <option value="delete_invoice">Xóa hóa đơn</option>
                    <option value="shift_close">Kết ca</option>
                    <option value="login">Đăng nhập</option>
                    <option value="system">Hệ thống / Đổi ca</option>
                    <option value="menu_update">Cập nhật thực đơn</option>
                    <option value="return_item">Trả món</option>
                    <option value="cancel_item">Hủy món</option>
                    <option value="edit_price">Sửa tiền món</option>
                    <option value="delete_order">Xóa bỏ đơn</option>
                    <option value="maintenance">Bảo trì dữ liệu</option>
                    <option value="warehouse">Quản lý kho</option>
                    <option value="view_report">Xem báo cáo</option>
                    <option value="debt">Công nợ</option>
                </select>

                <select id="pos-activity-staff-select" class="activity-select">
                    <option value="">&lt;Nhân viên&gt;</option>
                </select>

                <button type="button" id="pos-activity-btn-order-log" class="btn-activity-filter">
                    Nhật ký gọi món
                </button>
            </div>
        </div>

        <!-- # Table Data -->
        <div class="activity-modal-table-container">
            <table class="activity-modal-table" id="pos-activity-table">
                <thead>
                    <tr>
                        <th class="u-audi-66433d4d">Thời điểm</th>
                        <th class="u-audi-66433d4d">Hoạt động</th>
                        <th>Chi tiết</th>
                        <th class="u-audi-c25159cb">Thực hiện</th>
                    </tr>
                </thead>
                <tbody id="pos-activity-tbody">
                    <tr>
                        <td colspan="4" class="activity-empty-notice">Đang tải dữ liệu nhật ký...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- # Footer -->
        <div class="activity-modal-footer">
            <div class="activity-footer-summary">
                <span id="pos-activity-count">Đang tải...</span>
            </div>
            <a href="{% url 'audit:activity_export_excel' %}" id="pos-activity-btn-export" class="btn-activity-excel">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                Xuất ra Excel
            </a>
        </div>
    </div>
</div>
