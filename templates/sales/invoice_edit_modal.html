<!-- MODAL: SỬA HÓA ĐƠN THEO CHUẨN GIAO DIỆN F&B 2026 -->
<div class="menu-modal-backdrop sub-modal" id="modal-invoice-editor" hidden>
    <div class="menu-modal-dialog invoice-editor-dialog">
        <!-- Modal Header -->
        <div class="menu-modal-header invoice-editor-header">
            <div class="modal-title-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                <h3 id="inv-edit-modal-title">Sửa hóa đơn - Thu Ngân</h3>
            </div>
            <button type="button" class="dialog-close" id="modal-inv-edit-close" aria-label="Đóng">&times;</button>
        </div>

        <div class="invoice-editor-body">
            <!-- Top Meta Info (Bàn, Nhân viên, Kiểu thanh toán) -->
            <div class="inv-edit-meta-bar">
                <div class="inv-edit-table-box">
                    <span class="meta-label">Bàn:</span>
                    <strong id="inv-edit-table-name" class="meta-val">--</strong>
                </div>
                <div class="inv-edit-meta-controls">
                    <div class="inv-edit-control-group">
                        <label for="inv-edit-cashier-select">Nhân viên:</label>
                        <select id="inv-edit-cashier-select" class="inv-edit-select"></select>
                    </div>
                    <div class="inv-edit-control-group">
                        <label for="inv-edit-payment-select">Kiểu thanh toán:</label>
                        <select id="inv-edit-payment-select" class="inv-edit-select"></select>
                    </div>
                </div>
            </div>

            <!-- Items Table & +/- Controls -->
            <div class="inv-edit-table-wrapper">
                <div class="inv-edit-table-scroll">
                    <table class="inv-edit-table">
                        <thead>
                            <tr>
                                <th>Tên món</th>
                                <th style="width: 90px;" class="text-right">ĐG (đ)</th>
                                <th style="width: 70px;" class="text-center">GG (%)</th>
                                <th style="width: 55px;" class="text-center">SL</th>
                            </tr>
                        </thead>
                        <tbody id="inv-edit-items-tbody">
                            <!-- Items will be injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div class="inv-edit-side-actions">
                    <button type="button" id="inv-edit-btn-plus" class="btn-inv-qty-side" title="Tăng số lượng món đang chọn">+</button>
                    <button type="button" id="inv-edit-btn-minus" class="btn-inv-qty-side" title="Giảm số lượng món đang chọn">&minus;</button>
                </div>
            </div>

            <!-- Add Dish / Search Row -->
            <div class="inv-edit-add-section">
                <div class="inv-edit-custom-row">
                    <input type="text" id="inv-edit-custom-name" placeholder="<Thêm món khác>" class="inv-edit-input-custom">
                    <input type="number" id="inv-edit-custom-price" placeholder="Đơn giá (đ)" class="inv-edit-input-custom-price" min="0" step="1000">
                    <button type="button" id="inv-edit-btn-add-custom" class="btn-inv-find">Thêm</button>
                </div>
                <div class="inv-edit-product-row">
                    <select id="inv-edit-product-select" class="inv-edit-product-dropdown">
                        <option value="">&lt;Thêm món mới&gt;</option>
                    </select>
                </div>
            </div>

            <!-- Totals & Adjustments (Tiền món, Phụ thu, Giảm giá, VAT, Thành tiền) -->
            <div class="inv-edit-totals-card">
                <div class="inv-edit-total-row">
                    <span class="total-label">Tiền món:</span>
                    <strong class="total-val" id="inv-edit-subtotal-display">0 đ</strong>
                </div>
                <div class="inv-edit-total-row">
                    <label for="inv-edit-surcharge-input" class="total-label">Phụ thu (% | đ):</label>
                    <input type="number" id="inv-edit-surcharge-input" value="0" min="0" step="1000" class="inv-edit-calc-input">
                </div>
                <div class="inv-edit-total-row">
                    <label for="inv-edit-discount-input" class="total-label">Giảm giá (% | đ):</label>
                    <input type="number" id="inv-edit-discount-input" value="0" min="0" step="1000" class="inv-edit-calc-input">
                </div>
                <div class="inv-edit-total-row">
                    <label for="inv-edit-tax-input" class="total-label">VAT (%):</label>
                    <input type="number" id="inv-edit-tax-input" value="0" min="0" step="1" max="100" class="inv-edit-calc-input">
                </div>
                <div class="inv-edit-total-row final-total-row">
                    <span class="total-label">Thành tiền:</span>
                    <strong class="total-val final-val" id="inv-edit-total-display">0 đ</strong>
                </div>
            </div>

            <!-- Footer Buttons -->
            <div class="invoice-editor-footer">
                <button type="button" id="btn-inv-edit-confirm" class="primary-button btn-confirm-edit">
                    Xác nhận sửa
                </button>
                <button type="button" id="btn-inv-edit-cancel" class="secondary-button btn-cancel-edit">
                    Bỏ qua
                </button>
            </div>
        </div>
    </div>
</div>

<!-- SUB-MODAL: LÝ DO SỬA HÓA ĐƠN (HIỂN THỊ KHI BẤM XÁC NHẬN SỬA) -->
<div class="menu-modal-backdrop sub-modal reason-sub-modal" id="modal-inv-edit-reason" hidden>
    <div class="menu-modal-dialog inv-reason-popup-dialog" role="dialog" aria-modal="true" aria-labelledby="inv-reason-popup-title">
        <div class="menu-modal-header inv-reason-popup-header">
            <div class="modal-title-wrap">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                <h3 id="inv-reason-popup-title">Lý do sửa hóa đơn</h3>
            </div>
            <button type="button" class="dialog-close" id="modal-inv-reason-close" aria-label="Đóng">&times;</button>
        </div>
        <div class="inv-reason-popup-body">
            <div class="inv-reason-field-group">
                <label for="inv-edit-reason-input">Nhập lý do</label>
                <input type="text" id="inv-edit-reason-input" class="inv-edit-reason-input" maxlength="255" placeholder="Nhập lý do sửa hóa đơn..." autocomplete="off">
            </div>
            <div class="inv-reason-popup-actions">
                <button type="button" id="btn-inv-reason-confirm" class="btn-reason-confirm" disabled>
                    Xác nhận
                </button>
                <button type="button" id="btn-inv-reason-cancel" class="btn-reason-cancel">
                    Hủy bỏ
                </button>
            </div>
        </div>
    </div>
</div>
