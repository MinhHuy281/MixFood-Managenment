<!-- # File này chịu trách nhiệm hiển thị hộp thoại Thống kê Lượng khách hôm nay / cuối ngày trên màn hình POS. -->
{% load static %}
<!-- # MODAL: LƯỢNG KHÁCH HÔM NAY / CUỐI NGÀY (ĐỒNG BỘ POS 2026 & ẢNH MẪU) -->
<div class="menu-modal-backdrop sub-modal reason-sub-modal" id="modal-guest-count-today"
     data-api-url="{% url 'sales:guest_count_today_api' %}"
     role="dialog" aria-modal="true" aria-labelledby="guest-count-modal-title" hidden>
    <div class="menu-modal-dialog inv-reason-popup-dialog guest-count-popup-dialog">
        <!-- # Modal Header -->
        <div class="menu-modal-header inv-reason-popup-header guest-count-popup-header">
            <div class="modal-title-wrap">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <h3 id="guest-count-modal-title">Lượng khách hôm nay</h3>
            </div>
            <button type="button" class="dialog-close" id="guest-count-modal-close" aria-label="Đóng">&times;</button>
        </div>

        <!-- # Modal Body -->
        <div class="inv-reason-popup-body guest-count-popup-body">
            <div class="guest-count-content-row">
                <div class="guest-count-info-badge" aria-hidden="true">i</div>
                <div class="guest-count-stats-list">
                    <div class="gc-stat-line">
                        Số điểm bàn có khách / Tổng số điểm bàn: <strong id="gc-tables-ratio">0/0</strong>
                    </div>
                    <div class="gc-stat-line">
                        Số khách hiện có / Tổng số khách hôm nay: <strong id="gc-guests-ratio">?/?</strong>
                    </div>
                    <div class="gc-stat-line">
                        Số món đang bán / Tổng số món bán hôm nay: <strong id="gc-items-total-ratio">0/0</strong>
                    </div>
                    <div class="gc-stat-line gc-stat-subline">
                        + Đồ ăn: <strong id="gc-items-food-ratio">0/0</strong>
                    </div>
                    <div class="gc-stat-line gc-stat-subline">
                        + Thức uống: <strong id="gc-items-drink-ratio">0/0</strong>
                    </div>
                    <div class="gc-stat-line gc-stat-subline">
                        + Loại khác: <strong id="gc-items-other-ratio">0/0</strong>
                    </div>
                    <div class="gc-stat-line">
                        Số lượt nhận món bếp hôm nay: <strong id="gc-kitchen-count">0</strong>
                    </div>
                </div>
            </div>

            <div class="guest-count-popup-footer">
                <button type="button" id="guest-count-modal-ok" class="btn-guest-count-ok">OK</button>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/sales/guest_count_today_modal.js' %}?v={% now 'U' %}"></script>
